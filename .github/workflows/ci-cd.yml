name: CI/CD

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-api:
    name: Линтинг API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить форматирование
        run: go tool golangci-lint fmt --config .golangci.yml --diff
      - name: Запустить линтер
        run: go tool golangci-lint run --config .golangci.yml ./api/... ./internal/...
      - name: Проверить зависимости
        run: go mod tidy -diff

  lint-operator:
    name: Линтинг оператора
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить форматирование
        run: go tool golangci-lint fmt --config .golangci.yml --diff
      - name: Запустить линтер
        run: go tool golangci-lint run --config .golangci.yml ./operator/... ./internal/...
      - name: Проверить сгенерированные файлы
        run: scripts/check_operator_generated.sh

  lint-web:
    name: Линтинг клиентского приложения
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.8.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Установить зависимости
        run: pnpm install --frozen-lockfile
      - name: Проверить форматирование
        run: pnpm format:check
      - name: Запустить линтеры
        run: pnpm lint
      - name: Проверить типы
        run: pnpm typecheck

  test-api:
    name: Тесты API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.0
      - name: Установить системные зависимости
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Запустить тесты
        working-directory: api
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        run: just test
      - name: Сохранить диагностику
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-test-diagnostics-${{ github.sha }}
          path: tmp/k3s/api/*/diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  test-operator:
    name: Тесты оператора (unit/envtest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.0
      - name: Запустить ограниченный набор unit/envtest
        working-directory: operator
        run: just test
      - name: Сохранить результаты и диагностику
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-ci-unit-envtest-${{ github.sha }}
          path: tmp/operator/ci/**
          if-no-files-found: error
          retention-days: 7

  test-web:
    name: Тесты клиентского приложения
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.8.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.0
      - name: Установить зависимости
        run: pnpm install --frozen-lockfile
      - name: Запустить тесты
        run: just test

  test-integrations:
    name: Интеграция API и оператора
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.0
      - name: Установить системные зависимости
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Запустить общую интеграцию
        env:
          MV_TEST_MEMORY_MIB: "2048"
          MV_TEST_MIN_AVAILABLE_MIB: "1024"
          POSTGRES_PASSWORD: ci-postgres-password
        run: just test-integrations
      - name: Проверить диагностику
        id: check-integration-artifacts
        if: failure()
        run: |
          scanner_args=()
          for secret_values in tmp/k3s/integration/*/integration-secret-values; do
            if [[ -f "$secret_values" ]]; then
              scanner_args+=(--secret-values-file "$secret_values")
            fi
          done
          scripts/check_test_artifacts.sh \
            "${scanner_args[@]}" \
            tmp/k3s/integration/*/diagnostics
      - name: Сохранить диагностику
        if: failure() && steps.check-integration-artifacts.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-test-diagnostics-${{ github.sha }}
          path: tmp/k3s/integration/*/diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  test-e2e:
    name: Полный сквозной набор Playwright (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [lifecycle, quotas, failures]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Освободить место для трёхнодового стенда
        run: |
          sudo rm -rf -- \
            /opt/az \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          df -h /
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.8.0
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.0
      - name: Установить системные зависимости
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Установить зависимости клиентского приложения
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Установить зависимости e2e
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile
      - name: Проверить каталог e2e
        run: scripts/check_e2e_catalog.sh "${{ matrix.group }}"
      - name: Установить Chromium
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Запустить полный сквозной набор
        env:
          MV_TEST_MEMORY_MIB: "3072"
          MV_TEST_MIN_AVAILABLE_MIB: "1024"
          POSTGRES_PASSWORD: ci-postgres-password
          VALKEY_INTEGRATION_REQUEST_CPU: "100m"
          VALKEY_INTEGRATION_REQUEST_MEMORY: "128Mi"
        run: just test-e2e-group "${{ matrix.group }}"
      - name: Проверить диагностику на секреты
        id: check-e2e-artifacts
        if: failure()
        run: |
          scanner_args=()
          for secret_values in tmp/k3s/e2e/*/e2e-secret-values; do
            if [[ -f "$secret_values" ]]; then
              scanner_args+=(--secret-values-file "$secret_values")
            fi
          done
          scripts/check_e2e_artifacts.sh \
            "${scanner_args[@]}" \
            tmp/playwright/e2e \
            tmp/k3s/e2e/*/diagnostics
      - name: Сохранить диагностику
        if: failure() && steps.check-e2e-artifacts.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-test-diagnostics-${{ matrix.group }}-${{ github.sha }}
          path: |
            tmp/playwright/e2e/**
            tmp/k3s/e2e/*/diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  build-api:
    name: Сборка API и миграций
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Собрать образы
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --tag "managed-valkey/api:${GITHUB_SHA}" \
            --output "type=docker,dest=/tmp/api.tar" \
            --file api/Dockerfile .
          docker buildx build \
            --platform linux/amd64 \
            --target migrate \
            --tag "managed-valkey/migrate:${GITHUB_SHA}" \
            --output "type=docker,dest=/tmp/migrate.tar" \
            --file api/Dockerfile .
      - name: Проверить платформу образов
        run: |
          docker load --input /tmp/api.tar
          docker load --input /tmp/migrate.tar
          test "$(docker image inspect "managed-valkey/api:${GITHUB_SHA}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "managed-valkey/migrate:${GITHUB_SHA}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
      - name: Сжать образы
        run: gzip -9 /tmp/api.tar /tmp/migrate.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-images-${{ github.sha }}
          path: |
            /tmp/api.tar.gz
            /tmp/migrate.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-web:
    name: Сборка Caddy и клиентского приложения
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Собрать образ
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "managed-valkey/caddy:${GITHUB_SHA}" \
            --output "type=docker,dest=/tmp/caddy.tar" \
            --file caddy/Dockerfile .
      - name: Проверить образ
        run: |
          docker load --input /tmp/caddy.tar
          test "$(docker image inspect "managed-valkey/caddy:${GITHUB_SHA}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run --rm --entrypoint sh "managed-valkey/caddy:${GITHUB_SHA}" -c 'test -s /srv/index.html'
          docker run --rm "managed-valkey/caddy:${GITHUB_SHA}" caddy validate --config /etc/caddy/Caddyfile
      - name: Сжать образ
        run: gzip -9 /tmp/caddy.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caddy-image-${{ github.sha }}
          path: /tmp/caddy.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-operator:
    name: Сборка и публикация оператора
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      OPERATOR_IMAGE: ghcr.io/rostislavdugin/managed-valkey-operator:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Собрать образ
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$OPERATOR_IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --load \
            --file operator/Dockerfile .
      - name: Проверить образ
        run: |
          test "$(docker image inspect "$OPERATOR_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$OPERATOR_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$OPERATOR_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          container=$(docker create "$OPERATOR_IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/operator" /tmp/operator
          test -x /tmp/operator
      - name: Войти в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'RostislavDugin/managed-valkey'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Опубликовать образ
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'RostislavDugin/managed-valkey'
        run: docker push "$OPERATOR_IMAGE"

  ci-success:
    name: Итоговая проверка CI
    if: always()
    needs:
      - lint-api
      - lint-operator
      - lint-web
      - test-api
      - test-operator
      - test-web
      - test-integrations
      - test-e2e
      - build-api
      - build-web
      - build-operator
    runs-on: ubuntu-24.04
    steps:
      - name: Проверить результаты обязательных заданий
        env:
          LINT_API_RESULT: ${{ needs.lint-api.result }}
          LINT_OPERATOR_RESULT: ${{ needs.lint-operator.result }}
          LINT_WEB_RESULT: ${{ needs.lint-web.result }}
          TEST_API_RESULT: ${{ needs.test-api.result }}
          TEST_OPERATOR_RESULT: ${{ needs.test-operator.result }}
          TEST_WEB_RESULT: ${{ needs.test-web.result }}
          TEST_INTEGRATIONS_RESULT: ${{ needs.test-integrations.result }}
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          BUILD_API_RESULT: ${{ needs.build-api.result }}
          BUILD_WEB_RESULT: ${{ needs.build-web.result }}
          BUILD_OPERATOR_RESULT: ${{ needs.build-operator.result }}
        run: |
          results=(
            "lint-api=$LINT_API_RESULT"
            "lint-operator=$LINT_OPERATOR_RESULT"
            "lint-web=$LINT_WEB_RESULT"
            "test-api=$TEST_API_RESULT"
            "test-operator=$TEST_OPERATOR_RESULT"
            "test-web=$TEST_WEB_RESULT"
            "test-integrations=$TEST_INTEGRATIONS_RESULT"
            "test-e2e=$TEST_E2E_RESULT"
            "build-api=$BUILD_API_RESULT"
            "build-web=$BUILD_WEB_RESULT"
            "build-operator=$BUILD_OPERATOR_RESULT"
          )
          failed=0
          for result in "${results[@]}"; do
            if [[ ${result#*=} != success ]]; then
              echo "$result" >&2
              failed=1
            fi
          done
          exit "$failed"

  deploy:
    name: Развёртывание рабочего окружения
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'RostislavDugin/managed-valkey'
    needs: [ci-success]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_KUBECONFIG: ${{ secrets.PRODUCTION_KUBECONFIG }}
      PRODUCTION_KUBELET_CA: ${{ secrets.PRODUCTION_KUBELET_CA }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: api-images-${{ github.sha }}
          path: deploy-bundle/images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: caddy-image-${{ github.sha }}
          path: deploy-bundle/images
      - name: Подготовить файлы
        run: |
          required=(
            PRODUCTION_HOST
            PRODUCTION_SSH_USER
            PRODUCTION_SSH_PORT
            PRODUCTION_SSH_KNOWN_HOSTS
            PRODUCTION_SSH_PRIVATE_KEY
            PRODUCTION_KUBECONFIG
            PRODUCTION_KUBELET_CA
            CLOUDFLARE_API_TOKEN
            POSTGRES_PASSWORD
            JWT_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z ${!name} ]]; then
              echo "не задано обязательное значение $name" >&2
              exit 1
            fi
          done
          if [[ ! $PRODUCTION_HOST =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "PRODUCTION_HOST содержит недопустимые символы" >&2
            exit 1
          fi
          if [[ ! $PRODUCTION_SSH_USER =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "PRODUCTION_SSH_USER содержит недопустимые символы" >&2
            exit 1
          fi
          if [[ ! $PRODUCTION_SSH_PORT =~ ^[0-9]+$ ]] || ((PRODUCTION_SSH_PORT < 1 || PRODUCTION_SSH_PORT > 65535)); then
            echo "PRODUCTION_SSH_PORT должен быть числом от 1 до 65535" >&2
            exit 1
          fi
          if [[ ! $POSTGRES_PASSWORD =~ ^[A-Za-z0-9._~-]+$ ]]; then
            echo "POSTGRES_PASSWORD должен состоять из символов, допустимых в URL без кодирования" >&2
            exit 1
          fi
          if [[ $JWT_SECRET == *$'\n'* || $JWT_SECRET == *$'\r'* ]]; then
            echo "JWT_SECRET не должен содержать перевод строки" >&2
            exit 1
          fi

          umask 077
          mkdir -p deploy-bundle/images deploy-bundle/secrets/kubeconfig "$HOME/.ssh"
          printf '%s' "$PRODUCTION_KUBECONFIG" >"$RUNNER_TEMP/production.kubeconfig"
          printf '%s' "$PRODUCTION_KUBELET_CA" >"$RUNNER_TEMP/production-kubelet-ca.crt"
          chmod 0600 "$RUNNER_TEMP/production.kubeconfig"
          chmod 0600 "$RUNNER_TEMP/production-kubelet-ca.crt"
          scripts/deploy_kubernetes.sh \
            "$GITHUB_SHA" \
            "$RUNNER_TEMP/production.kubeconfig" \
            deploy-bundle/secrets/kubeconfig/api.kubeconfig \
            "$RUNNER_TEMP/production-kubelet-ca.crt"
          jwt_secret_escaped=${JWT_SECRET//\'/\\\'}
          printf "POSTGRES_PASSWORD=%s\nJWT_SECRET='%s'\n" "$POSTGRES_PASSWORD" "$jwt_secret_escaped" >deploy-bundle/.env
          cat >deploy-bundle/release.env <<EOF
          RELEASE_SHA=$GITHUB_SHA
          API_IMAGE=managed-valkey/api:$GITHUB_SHA
          MIGRATE_IMAGE=managed-valkey/migrate:$GITHUB_SHA
          CADDY_IMAGE=managed-valkey/caddy:$GITHUB_SHA
          EOF
          install -m 0644 docker-compose.prod.yml deploy-bundle/docker-compose.prod.yml
          install -m 0755 scripts/install_release.sh deploy-bundle/install_release.sh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" >"$HOME/.ssh/production"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/production" "$HOME/.ssh/known_hosts" deploy-bundle/.env
          test "$(find deploy-bundle/images -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 3
          test "$(stat -c '%a' deploy-bundle/.env)" = 600
          test "$(stat -c '%a' deploy-bundle/secrets/kubeconfig/api.kubeconfig)" = 600
      - name: Передать и установить
        run: |
          ssh_options=(
            -i "$HOME/.ssh/production"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote="$PRODUCTION_SSH_USER@$PRODUCTION_HOST"
          staging="/tmp/managed-valkey-$GITHUB_SHA"

          ssh "${ssh_options[@]}" "$remote" "install -d -m 0700 '$staging'"
          scp \
            -i "$HOME/.ssh/production" \
            -P "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -r deploy-bundle/. "$remote:$staging/"
          ssh "${ssh_options[@]}" "$remote" \
            "trap 'rm -rf \"$staging\"' EXIT; bash '$staging/install_release.sh' '$GITHUB_SHA' '$staging'"
      - name: Удалить временные файлы подключения Kubernetes
        if: always()
        run: |
          rm -f -- \
            "$RUNNER_TEMP/production.kubeconfig" \
            "$RUNNER_TEMP/production-kubelet-ca.crt" \
            deploy-bundle/secrets/kubeconfig/api.kubeconfig
