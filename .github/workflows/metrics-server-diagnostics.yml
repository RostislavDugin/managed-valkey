name: Metrics Server diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Диагностика Metrics Server
    runs-on: ubuntu-24.04
    environment: production
    env:
      PRODUCTION_KUBECONFIG: ${{ secrets.PRODUCTION_KUBECONFIG }}
    steps:
      - name: Получить состояние и логи
        run: |
          umask 077
          printf '%s' "$PRODUCTION_KUBECONFIG" >"$RUNNER_TEMP/production.kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/production.kubeconfig"
          kubectl -n kube-system get deployment,pods \
            -l app.kubernetes.io/instance=metrics-server \
            -o wide
          kubectl -n kube-system get deployment metrics-server -o yaml
          node=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          node_ip=$(kubectl get node "$node" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          certificate_pod="metrics-server-certificate-${GITHUB_RUN_ID}"
          trap 'kubectl -n kube-system delete pod "$certificate_pod" --ignore-not-found --wait=true --timeout=60s >/dev/null' EXIT
          kubectl get certificatesigningrequests -o wide
          kubectl get certificatesigningrequests -o json | jq -r \
            --arg username "system:node:$node" \
            '.items[] | select(.spec.username == $username and (.status.certificate // "") != "") | [.metadata.creationTimestamp, .metadata.name, .spec.signerName, .status.certificate] | @tsv' | \
            sort | tail -n 1 | while IFS=$'\t' read -r created name signer certificate; do
              echo "CSR $name, создан $created, signerName=$signer"
              printf '%s' "$certificate" | base64 -d | \
                openssl x509 -noout -subject -issuer -ext subjectAltName -fingerprint -sha256
            done
          kubectl -n kube-system get configmaps -o name | sort
          kubectl -n kube-system run "$certificate_pod" \
            --image=alpine/openssl:3.5.4 \
            --restart=Never \
            --command -- sh -c \
            "openssl s_client -connect '$node_ip:10250' -servername '$node' -showcerts </dev/null"
          kubectl -n kube-system wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            "pod/$certificate_pod" \
            --timeout=120s
          kubectl -n kube-system logs "$certificate_pod"
          while IFS= read -r pod; do
            echo "Логи $pod"
            kubectl -n kube-system logs "$pod" --all-containers=true --tail=100
          done < <(
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/instance=metrics-server \
              -o name
          )
      - name: Удалить kubeconfig
        if: always()
        run: rm -f -- "$RUNNER_TEMP/production.kubeconfig"
