name: ${MANAGED_VALKEY_COMPOSE_PROJECT:-managed-valkey-dev}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-managed_valkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-managed_valkey}
      POSTGRES_DB: ${POSTGRES_DB:-managed_valkey}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-45432}:5432"
    networks:
      default:
        ipv4_address: 172.27.0.2
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-managed_valkey} -d ${POSTGRES_DB:-managed_valkey}"]
      interval: 5s
      timeout: 5s
      retries: 30

  k3s-server:
    image: rancher/k3s:v1.35.7-k3s1
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --cluster-cidr=${K3S_CLUSTER_CIDR:-10.42.0.0/16}
      - --service-cidr=${K3S_SERVICE_CIDR:-10.43.0.0/16}
      - --cluster-dns=${K3S_CLUSTER_DNS:-10.43.0.10}
      - --node-name=${K3S_SERVER_NAME:-k3s-server}
      - --tls-san=k3s-server
      - --tls-san=127.0.0.1
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_TOKEN: ${K3S_TOKEN:-managed-valkey-dev-token}
    ports:
      - "${K3S_API_BINDING:-127.0.0.1:6443:6443}"
      - "${K3S_PUBLIC_BINDING:-127.0.0.1:41379:31379}"
    networks:
      default:
        ipv4_address: 172.27.0.3
    volumes:
      - k3s-server-data:/var/lib/rancher/k3s
    healthcheck:
      test: ["CMD-SHELL", "kubectl get --raw=/readyz"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  k3s-agent-1: &k3s-agent
    image: rancher/k3s:v1.35.7-k3s1
    command:
      - agent
      - --node-name=k3s-agent-1
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_URL: https://k3s-server:6443
      K3S_TOKEN: ${K3S_TOKEN:-managed-valkey-dev-token}
    networks:
      default:
        ipv4_address: 172.27.0.5
    volumes:
      - k3s-agent-1-node:/etc/rancher/node
    depends_on:
      k3s-server:
        condition: service_healthy

  k3s-agent-2:
    <<: *k3s-agent
    command:
      - agent
      - --node-name=k3s-agent-2
    networks:
      default:
        ipv4_address: 172.27.0.4
    volumes:
      - k3s-agent-2-node:/etc/rancher/node

networks:
  default:
    ipam:
      config:
        - subnet: 172.27.0.0/16

volumes:
  postgres-data:
  k3s-server-data:
  k3s-agent-1-node:
  k3s-agent-2-node:
