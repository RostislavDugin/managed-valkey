apiVersion: v1
kind: Namespace
metadata:
  name: mv-verify-envoy
  labels:
    managed-valkey.h3llo-demo.com/instance: verify
---
apiVersion: v1
kind: Service
metadata:
  name: verify-primary
  namespace: mv-verify-envoy
spec:
  selector:
    app: verify-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: v1
kind: Pod
metadata:
  name: verify-valkey
  namespace: mv-verify-envoy
  labels:
    app: verify-valkey
spec:
  containers:
    - name: valkey
      image: valkey/valkey:8.1.9
      imagePullPolicy: IfNotPresent
      ports:
        - name: valkey
          containerPort: 6379
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: verify
  namespace: mv-verify-envoy
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: valkey-system
      name: valkey
      sectionName: verify
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: verify-primary
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verify
  namespace: mv-verify-envoy
spec:
  podSelector:
    matchLabels:
      app: verify-valkey
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey-system
        - podSelector:
            matchLabels:
              app: verify-valkey
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: verify-valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: verify
  namespace: mv-verify-envoy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: verify
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-client
        action: Allow
        principal:
          clientCIDRs:
            - 203.0.113.0/24
