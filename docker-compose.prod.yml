name: managed-valkey

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: managed_valkey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: managed_valkey
      PGPORT: "45432"
    ports:
      - "127.0.0.1:45432:45432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U managed_valkey -d managed_valkey -p 45432"]
      interval: 5s
      timeout: 5s
      retries: 30

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=168h
    volumes:
      - victorialogs-data:/victoria-logs-data
    restart: unless-stopped

  migrate:
    image: ${MIGRATE_IMAGE:-managed-valkey/migrate:dev}
    pull_policy: never
    command:
      - postgres
      - postgres://managed_valkey:${POSTGRES_PASSWORD}@postgres:45432/managed_valkey?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${API_IMAGE:-managed-valkey/api:dev}
    pull_policy: never
    environment:
      APP_ENV: prod
      LOG_LEVEL: info
      VL_OTLP_URL: http://victorialogs:9428/insert/opentelemetry/v1/logs
      DATABASE_URL: postgres://managed_valkey:${POSTGRES_PASSWORD}@postgres:45432/managed_valkey?sslmode=disable
      HTTP_ADDR: ":8080"
      KUBECONFIG: /kubeconfig/api.kubeconfig
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET}
    volumes:
      - /opt/managed-valkey/secrets/kubeconfig/api.kubeconfig:/kubeconfig/api.kubeconfig:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-managed-valkey/caddy:dev}
    pull_policy: never
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  victorialogs-data:
  caddy-data:
  caddy-config:
