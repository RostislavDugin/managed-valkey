# Права лежат в operator/config/rbac/role.yaml и генерируются controller-gen из
# Go-маркеров; здесь только учётная запись и привязки.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: managed-valkey-operator
  namespace: valkey-system
---
apiVersion: v1
kind: Secret
metadata:
  name: managed-valkey-operator-token
  namespace: valkey-system
  annotations:
    kubernetes.io/service-account.name: managed-valkey-operator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: managed-valkey-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: managed-valkey-operator
subjects:
  - kind: ServiceAccount
    name: managed-valkey-operator
    namespace: valkey-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: managed-valkey-operator
  namespace: valkey-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: managed-valkey-operator
subjects:
  - kind: ServiceAccount
    name: managed-valkey-operator
    namespace: valkey-system
---
# Оператор читает admin API прокси Envoy для подтверждения конфигурации.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: managed-valkey-operator-portforward
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: managed-valkey-operator-portforward
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: managed-valkey-operator-portforward
subjects:
  - kind: ServiceAccount
    name: managed-valkey-operator
    namespace: valkey-system
