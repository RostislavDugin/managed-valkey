crds:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  replicaCount: 3
  hostNetwork: true
  securePort: 443
  url:
    host: cert-manager-webhook.valkey.h3llo-demo.com
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      add: [NET_BIND_SERVICE]
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsUser: 0
    runAsGroup: 0
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: webhook
              app.kubernetes.io/instance: cert-manager
              app.kubernetes.io/name: webhook
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

cainjector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
