# Права оператора генерирует controller-gen в operator/config/rbac/role.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: managed-valkey-operator
  namespace: valkey-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: managed-valkey-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: managed-valkey-operator
subjects:
  - kind: ServiceAccount
    name: managed-valkey-operator
    namespace: valkey-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: managed-valkey-operator
  namespace: valkey-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: managed-valkey-operator
subjects:
  - kind: ServiceAccount
    name: managed-valkey-operator
    namespace: valkey-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: managed-valkey-operator-portforward
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: managed-valkey-operator
subjects:
  - kind: ServiceAccount
    name: managed-valkey-operator
    namespace: valkey-system
