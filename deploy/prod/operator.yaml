# Конфигурации PostgreSQL и адреса HTTP API сервиса здесь нет: оператор
# обменивается состоянием только через CR.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: operator
  namespace: valkey-system
spec:
  serviceName: operator
  replicas: 1
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: managed-valkey-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: managed-valkey-operator
    spec:
      serviceAccountName: managed-valkey-operator
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65532
      volumes:
        - name: logs-export
          secret:
            secretName: valkey-logs-export
            defaultMode: 0440
      containers:
        - name: operator
          image: managed-valkey/operator:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: prod
            - name: LOG_LEVEL
              value: info
            - name: VL_OTLP_URL
              value: https://logs.h3llo-demo.com/insert/opentelemetry/v1/logs
            - name: VL_OTLP_USERNAME
              value: valkey-operator
            - name: VL_OTLP_PASSWORD_FILE
              value: /var/run/valkey-logs/password
            - name: VALKEY_SYSTEM_NAMESPACE
              value: valkey-system
            - name: VALKEY_IMAGE
              value: valkey/valkey:8.1.9
            - name: VALKEY_BASE_DOMAIN
              value: valkey.h3llo-demo.com
            - name: VALKEY_PUBLIC_PORT
              value: "41379"
          volumeMounts:
            - name: logs-export
              mountPath: /var/run/valkey-logs
              readOnly: true
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Пользователь nonroot минимального образа; Kubernetes требует
            # числовой UID, чтобы проверить runAsNonRoot до запуска.
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: valkey-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: managed-valkey-operator
  ports:
    - name: probes
      port: 8081
      targetPort: probes
